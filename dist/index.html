<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="description" content="Персональний local-first таск-менеджер">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <title>DimsTasks</title>
  <style>
:root { color-scheme: light; --bg:#f5f5f5; --surface:#fff; --text:#171717; --muted:#6f6f72; --line:#e5e5e7; --accent:#3d5268; --date:#178b40; --danger:#d92d20; --overlay:rgba(20,20,20,.5); --shadow-fab:0 12px 26px rgba(32,46,60,.25); --shadow-sheet:0 -12px 40px rgba(0,0,0,.16); --ease-swipe:cubic-bezier(.22,1,.36,1); --radius:22px; }




* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
body { margin: 0; min-width: 280px; min-height: 100vh; }
button, input { font: inherit; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }


body { background:var(--bg); }
.app-shell { width:min(100%,760px); min-height:100dvh; margin:0 auto; padding:max(28px,env(safe-area-inset-top)) 20px calc(124px + env(safe-area-inset-bottom)); position:relative; }
.page-header { padding:18px 4px 54px; }
h1,h2,p { margin:0; }
h1 { font-size:clamp(2.25rem,9vw,3.4rem); line-height:1; letter-spacing:-.05em; font-weight:760; }
.page-header p { margin-top:9px; color:var(--muted); font-size:1.08rem; }
.selection-toolbar { min-height:58px; display:grid; grid-template-columns:48px minmax(0,1fr) auto; align-items:center; gap:10px; }
.selection-toolbar p { margin:0; color:var(--text); font-size:1.08rem; font-weight:720; }
.selection-actions { display:flex; align-items:center; gap:8px; }
.toolbar-action { width:46px; height:46px; display:grid; place-items:center; border:0; border-radius:15px; background:var(--surface); color:var(--text); box-shadow:0 4px 14px rgba(0,0,0,.06); }
.toolbar-action:active { transform:scale(.96); }
.toolbar-action.destructive { color:var(--danger); background:color-mix(in srgb,var(--danger) 9%,var(--surface)); }
.back-icon { width:17px; height:17px; border-left:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg); translate:4px 0; }
.trash-icon { width:18px; height:20px; border:2px solid currentColor; border-top:0; border-radius:2px 2px 5px 5px; position:relative; }
.trash-icon::before { content:""; position:absolute; left:-3px; right:-3px; top:-5px; border-top:2px solid currentColor; }
.trash-icon::after { content:""; position:absolute; width:8px; left:3px; top:-9px; border-top:2px solid currentColor; border-radius:2px; }
.task-section h2 { margin:0 4px 20px; font-size:1.35rem; letter-spacing:-.025em; }
#task-list { list-style:none; margin:0; padding:0; overflow:hidden; border-radius:var(--radius); background:var(--surface); }
.swipe-row { position:relative; overflow:hidden; border-bottom:1px solid var(--line); background:var(--danger); }
.swipe-row:last-child { border-bottom:0; }
.swipe-row.selected .task-card { background:#edf2f7; box-shadow:inset 4px 0 0 var(--accent); }
.selection-mode .toggle { border-color:color-mix(in srgb,var(--accent) 52%,var(--line)); }
.swipe-row.selected .toggle { border-color:var(--accent); background:var(--accent); }
.swipe-row.selected .toggle span { opacity:1; }
.delete-reveal { position:absolute; inset:0 0 0 auto; width:112px; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding-right:18px; color:#fff; font-size:.82rem; font-weight:760; opacity:0; transform:translateX(16px); transition:opacity .18s var(--ease-swipe),transform .24s var(--ease-swipe); }
.delete-icon { width:20px; height:23px; border:2px solid currentColor; border-top:0; border-radius:2px 2px 5px 5px; position:relative; }
.delete-icon::before { content:""; position:absolute; left:-3px; right:-3px; top:-6px; border-top:2px solid currentColor; border-radius:2px; }
.delete-icon::after { content:""; position:absolute; width:8px; left:4px; top:-10px; border-top:2px solid currentColor; border-radius:2px; }
.swipe-row.swiping .delete-reveal,.swipe-row.deleting .delete-reveal { opacity:1; transform:none; }
.task-card { position:relative; z-index:1; min-height:82px; display:grid; grid-template-columns:48px minmax(0,1fr); align-items:center; gap:10px; padding:14px 17px 14px 13px; background:var(--surface); touch-action:pan-y; user-select:none; will-change:transform; }
.swipe-row.settling .task-card { transition:transform .26s var(--ease-swipe); }
.swipe-row.deleting .task-card { transition:transform .3s var(--ease-swipe); }
.swipe-row.deleting .task-card { transform:translateX(-110%)!important; }
.toggle { width:34px; height:34px; display:grid; place-items:center; border:2px solid #aaa; border-radius:50%; background:transparent; color:#fff; }
.toggle span { opacity:0; }
.task-open { min-width:0; min-height:54px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; padding:0; border:0; background:transparent; color:inherit; text-align:left; font:inherit; }
.task-open:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:8px; }
.task-copy { min-width:0; display:block; }
.task-text { font-size:1.08rem; line-height:1.35; overflow-wrap:anywhere; }
.task-date { display:block; margin-top:5px; color:var(--date); font-size:.88rem; font-weight:590; }
.task-project { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:.9rem; white-space:nowrap; align-self:end; padding-bottom:5px; }
.inbox-icon { width:17px; height:15px; display:inline-block; border:2px solid currentColor; border-radius:3px 3px 5px 5px; position:relative; }
.inbox-icon::after { content:""; position:absolute; width:6px; height:3px; left:50%; bottom:2px; translate:-50% 0; border-bottom:2px solid currentColor; border-radius:50%; }
.empty { display:grid; justify-items:center; gap:8px; padding:76px 20px; color:var(--muted); text-align:center; }
.empty-icon { width:48px; height:48px; display:grid; place-items:center; border:2px solid var(--line); border-radius:50%; font-size:1.3rem; }
.empty p { color:var(--text); font-weight:680; }
.empty small { max-width:260px; line-height:1.45; }
.fab { position:fixed; z-index:5; right:max(22px,calc((100vw - 720px)/2)); bottom:calc(91px + env(safe-area-inset-bottom)); width:68px; height:68px; border:0; border-radius:22px; background:var(--accent); color:#fff; box-shadow:var(--shadow-fab); font-size:2.35rem; font-weight:300; display:grid; place-items:center; transition:opacity .15s,transform .15s; }
.fab:active { transform:translateY(2px); }
.app-shell.selection-active .fab { opacity:0; pointer-events:none; transform:scale(.92); }
.bottom-nav { position:fixed; z-index:4; inset:auto 0 0; min-height:calc(72px + env(safe-area-inset-bottom)); padding:8px 20px env(safe-area-inset-bottom); display:flex; justify-content:center; background:color-mix(in srgb,var(--surface) 94%,transparent); border-top:1px solid var(--line); backdrop-filter:blur(16px); }
.nav-item { min-width:112px; min-height:56px; border:0; border-radius:18px; background:transparent; color:var(--accent); display:grid; place-items:center; align-content:center; gap:5px; font-size:.78rem; font-weight:700; }
.nav-item .inbox-icon { width:21px; height:18px; }
.nav-item.active { background:#e7eaf0; }
.task-dialog { width:min(100% - 20px,720px); max-width:none; margin:auto auto 10px; padding:0; border:0; border-radius:34px; background:var(--surface); color:var(--text); box-shadow:var(--shadow-sheet); overflow:visible; }
.task-dialog::backdrop { background:var(--overlay); backdrop-filter:blur(1px); }
#task-form { padding:26px 24px 18px; }
.detail-header { min-height:36px; display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
.detail-header[hidden],.detail-fields[hidden],.attribute-placeholders[hidden] { display:none; }
.detail-list { display:inline-flex; align-items:center; gap:9px; color:var(--muted); font-size:.92rem; font-weight:720; }
.sheet-icon-button { width:42px; height:42px; border:0; border-radius:14px; display:grid; place-items:center; background:#f3f3f5; color:var(--muted); }
.sheet-icon-button span { width:14px; height:14px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg) translate(-2px,-2px); }
.task-title-row { display:grid; grid-template-columns:minmax(0,1fr); align-items:start; gap:12px; }
.detail-mode .task-title-row { grid-template-columns:38px minmax(0,1fr); }
.detail-toggle { width:32px; height:32px; margin-top:3px; }
#task-title { display:block; width:100%; min-height:58px; max-height:150px; resize:none; overflow-y:auto; border:0; outline:0; padding:0; background:transparent; color:var(--text); font:650 clamp(1.45rem,6vw,2rem)/1.25 system-ui,sans-serif; }
#task-title::placeholder { color:#aaa; opacity:1; }
.composer-actions { display:flex; align-items:center; gap:10px; margin-top:18px; overflow-x:auto; scrollbar-width:none; }
.composer-actions::-webkit-scrollbar { display:none; }
.detail-mode .composer-actions { margin-left:50px; }
.detail-mode .inbox-chip { display:none; }
.detail-fields { margin:8px 0 0 50px; }
#task-description { width:100%; min-height:64px; max-height:132px; resize:vertical; border:0; outline:0; padding:8px 0; background:transparent; color:var(--text); font:400 1rem/1.45 system-ui,sans-serif; }
#task-description::placeholder { color:var(--muted); opacity:.85; }
.meta-chip { min-height:48px; display:inline-flex; align-items:center; gap:9px; flex:0 0 auto; padding:0 15px; border:0; border-radius:14px; background:#f3f3f5; color:var(--text); font-weight:700; }
.date-chip { color:var(--date); position:relative; cursor:pointer; }
.date-chip input { position:absolute; inset:0; opacity:0; width:100%; cursor:pointer; }
.attribute-placeholders { display:flex; gap:9px; margin:16px 0 0 50px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.attribute-placeholders::-webkit-scrollbar { display:none; }
.attribute-chip { flex:0 0 auto; min-height:44px; padding:0 14px; border:0; border-radius:14px; display:inline-flex; align-items:center; gap:8px; background:#efefec; color:#555; font-weight:700; opacity:1; }
.attribute-chip:disabled { cursor:default; }
.calendar-icon { width:20px; height:20px; border:2px solid currentColor; border-radius:3px; position:relative; }
.calendar-icon::before { content:""; position:absolute; left:2px; right:2px; top:5px; border-top:2px solid currentColor; }
.form-hint { margin:13px 2px 0; color:var(--muted); font-size:.75rem; }
.toast { position:fixed; z-index:20; left:50%; bottom:calc(88px + env(safe-area-inset-bottom)); translate:-50% 16px; opacity:0; pointer-events:none; min-height:48px; display:flex; align-items:center; gap:14px; padding:8px 10px 8px 18px; border-radius:999px; background:var(--text); color:var(--surface); box-shadow:0 10px 30px rgba(0,0,0,.22); transition:opacity .18s,translate .18s; white-space:nowrap; }
.toast.show { opacity:1; translate:-50% 0; pointer-events:auto; }
.toast-action { min-height:36px; padding:0 4px; border:0; background:transparent; color:#9fc4ff; font-weight:760; }
.toast:not(.undoable) .toast-action,.toast:not(.undoable) .toast-timer { display:none; }
.toast-timer { width:28px; height:28px; transform:rotate(-90deg); }
.toast-timer-track,.toast-timer-progress { fill:none; stroke-width:2.5; }
.toast-timer-track { stroke:rgba(255,255,255,.22); }
.toast-timer-progress { stroke:#fff; stroke-linecap:round; stroke-dasharray:69.12; stroke-dashoffset:0; }
.toast.show.undoable .toast-timer-progress { animation:toast-countdown var(--toast-duration,3s) linear forwards; }
@keyframes toast-countdown { to { stroke-dashoffset:69.12; } }
@media (min-width:760px) { .app-shell { padding-inline:28px; } .fab { right:max(32px,calc((100vw - 700px)/2)); } .task-dialog { margin-bottom:28px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }



  </style>
</head>
<body>
<div class="app-shell">
  <header class="page-header">
    <div id="normal-header"><h1>Нові</h1><p id="task-count">0 задач</p></div>
    <div id="selection-toolbar" class="selection-toolbar" hidden>
      <button id="selection-close" class="toolbar-action" type="button" aria-label="Завершити виділення"><span class="back-icon" aria-hidden="true"></span></button>
      <p id="selection-count">Вибрано: 0</p>
      <div class="selection-actions" aria-label="Дії з вибраними завданнями">
        <button id="delete-selected" class="toolbar-action destructive" type="button" aria-label="Видалити вибрані завдання"><span class="trash-icon" aria-hidden="true"></span></button>
      </div>
    </div>
  </header>
  <main><section class="task-section" aria-labelledby="inbox-title">
    <h2 id="inbox-title">Нові</h2><ul id="task-list" aria-live="polite"></ul>
    <div id="empty-state" class="empty"><span class="empty-icon" aria-hidden="true">✓</span><p>Нових задач поки немає</p><small>Натисніть кнопку внизу, щоб додати першу.</small></div>
  </section></main>
  <button id="add-task-btn" class="fab" aria-label="Додати задачу"><span aria-hidden="true">＋</span></button>
  <nav class="bottom-nav" aria-label="Основна навігація"><button class="nav-item active" aria-current="page"><span class="inbox-icon" aria-hidden="true"></span><span>Нові</span></button></nav>
</div>
<dialog id="task-dialog" class="task-dialog">
  <form id="task-form" method="dialog">
    <div class="detail-header" hidden>
      <span class="detail-list"><span class="inbox-icon" aria-hidden="true"></span>Нові</span>
      <button id="collapse-task" class="sheet-icon-button" type="button" aria-label="Згорнути деталі завдання"><span aria-hidden="true"></span></button>
    </div>
    <div class="task-title-row">
      <button id="detail-toggle" class="toggle detail-toggle" type="button" aria-label="Позначити виконаною" hidden><span>✓</span></button>
      <label class="sr-only" for="task-title">Назва задачі</label>
      <textarea id="task-title" name="title" rows="1" maxlength="160" placeholder="Назва задачі" required></textarea>
    </div>
    <div class="detail-fields" hidden>
      <label class="sr-only" for="task-description">Опис завдання</label>
      <textarea id="task-description" name="description" rows="2" maxlength="1000" placeholder="Додати опис…"></textarea>
    </div>
    <div class="composer-actions">
      <span class="meta-chip inbox-chip"><span class="inbox-icon" aria-hidden="true"></span>Нові</span>
      <label class="meta-chip date-chip" for="task-date"><span class="calendar-icon" aria-hidden="true"></span><span id="date-label">Сьогодні</span><input id="task-date" name="date" type="date"></label>
    </div>
    <div class="attribute-placeholders" hidden aria-label="Атрибути завдання">
      <button class="attribute-chip" type="button" disabled><span aria-hidden="true">⚑</span>Пріоритет</button>
      <button class="attribute-chip" type="button" disabled><span aria-hidden="true">◷</span>Нагадування</button>
      <button class="attribute-chip" type="button" disabled><span aria-hidden="true">◇</span>Мітки</button>
      <button class="attribute-chip" type="button" disabled><span aria-hidden="true">◎</span>Повтор</button>
    </div>
    <p class="form-hint">Enter — додати · Shift+Enter — новий рядок</p>
  </form>
</dialog>
<template id="task-template"><li class="swipe-row"><div class="delete-reveal" aria-hidden="true"><span class="delete-icon"></span><span>Видалити</span></div><article class="task-card"><button class="toggle" aria-label="Позначити виконаною"><span>✓</span></button><button class="task-open" type="button" aria-label="Відкрити деталі завдання"><span class="task-copy"><span class="task-text"></span><span class="task-date"></span></span><span class="task-project">Нові <span class="inbox-icon" aria-hidden="true"></span></span></button></article></li></template>
<div id="toast" class="toast" role="status" aria-live="polite"><span class="toast-message"></span><button id="toast-action" class="toast-action" type="button">Відмінити</button><svg class="toast-timer" viewBox="0 0 28 28" aria-hidden="true"><circle class="toast-timer-track" cx="14" cy="14" r="11"></circle><circle class="toast-timer-progress" cx="14" cy="14" r="11"></circle></svg></div>



<script>
const DB_NAME = "dims-tasks-db";
const DB_VERSION = 2;
const STORE_NAMES = ["lists", "sections", "projects", "tasks"];
const INBOX_LIST_ID = "system-list-inbox";

function ensureIndex(store, name, keyPath, options = {}) {
  if (!store.indexNames.contains(name)) store.createIndex(name, keyPath, options);
}

function configureStore(db, transaction, name) {
  const store = db.objectStoreNames.contains(name)
    ? transaction.objectStore(name)
    : db.createObjectStore(name, { keyPath: "id" });
  if (name === "lists") {
    ensureIndex(store, "by-kind", "kind");
    ensureIndex(store, "by-position", "position");
  }
  if (name === "sections") {
    ensureIndex(store, "by-list", "listId");
    ensureIndex(store, "by-list-position", ["listId", "position"]);
  }
  if (name === "projects") {
    ensureIndex(store, "by-status", "status");
    ensureIndex(store, "by-position", "position");
  }
  if (name === "tasks") {
    ensureIndex(store, "by-list", "listId");
    ensureIndex(store, "by-section", "sectionId");
    ensureIndex(store, "by-project", "projectId");
    ensureIndex(store, "by-status", "status");
    ensureIndex(store, "by-due-date", "dueDate");
    ensureIndex(store, "by-list-status", ["listId", "status"]);
    ensureIndex(store, "by-project-position", ["projectId", "projectPosition"]);
  }
  return store;
}

function migrateLegacyTasks(store) {
  const request = store.openCursor();
  request.onsuccess = () => {
    const cursor = request.result;
    if (!cursor) return;
    const task = cursor.value;
    const completed = task.status === "completed" || task.done === true;
    cursor.update({
      ...task,
      entityVersion: task.entityVersion || 1,
      customFields: task.customFields || {},
      listId: task.listId || INBOX_LIST_ID,
      sectionId: task.sectionId ?? null,
      projectId: task.projectId ?? null,
      description: task.description || "",
      status: completed ? "completed" : "active",
      completedAt: completed ? (task.completedAt || task.updatedAt || new Date().toISOString()) : null,
      dueTime: task.dueTime ?? null,
      position: Number.isFinite(task.position) ? task.position : 0,
      projectPosition: Number.isFinite(task.projectPosition) ? task.projectPosition : null
    });
    cursor.continue();
  };
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = event => {
      const db = request.result;
      const transaction = request.transaction;
      const stores = Object.fromEntries(STORE_NAMES.map(name => [name, configureStore(db, transaction, name)]));
      if (event.oldVersion < 2) {
        const now = new Date().toISOString();
        stores.lists.put({ id: INBOX_LIST_ID, entityVersion: 1, title: "Інбокс", description: "", kind: "inbox", position: 0, customFields: {}, createdAt: now, updatedAt: now });
        migrateLegacyTasks(stores.tasks);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("Оновлення бази заблоковане іншою вкладкою DimsTasks"));
  });
}

async function transact(storeNames, mode, action) {
  const names = Array.isArray(storeNames) ? storeNames : [storeNames];
  const db = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(names, mode);
    try {
      action(tx, Object.fromEntries(names.map(name => [name, tx.objectStore(name)])));
    } catch (error) {
      tx.abort();
      db.close();
      reject(error);
      return;
    }
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
    tx.onabort = () => { db.close(); reject(tx.error || new Error("Транзакцію скасовано")); };
  });
}

function requestResult(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

const appDb = {
  all: async storeName => {
    const db = await openDatabase();
    try { return await requestResult(db.transaction(storeName, "readonly").objectStore(storeName).getAll()); }
    finally { db.close(); }
  },
  get: async (storeName, id) => {
    const db = await openDatabase();
    try { return await requestResult(db.transaction(storeName, "readonly").objectStore(storeName).get(id)); }
    finally { db.close(); }
  },
  put: (storeName, record) => transact(storeName, "readwrite", (_tx, stores) => stores[storeName].put(record)),
  delete: (storeName, id) => transact(storeName, "readwrite", (_tx, stores) => stores[storeName].delete(id)),
  exportAll: async () => Object.fromEntries(await Promise.all(STORE_NAMES.map(async name => [name, await appDb.all(name)]))),
  replaceAll: data => transact(STORE_NAMES, "readwrite", (_tx, stores) => {
    for (const name of STORE_NAMES) {
      stores[name].clear();
      for (const record of data[name] || []) stores[name].put(record);
    }
    if (!(data.lists || []).some(list => list.id === INBOX_LIST_ID)) {
      const now = new Date().toISOString();
      stores.lists.put({ id: INBOX_LIST_ID, entityVersion: 1, title: "Інбокс", description: "", kind: "inbox", position: 0, customFields: {}, createdAt: now, updatedAt: now });
    }
  })
};

const taskDb = {
  all: () => appDb.all("tasks"),
  put: task => appDb.put("tasks", task),
  delete: id => appDb.delete("tasks", id),
  putMany: tasks => transact("tasks", "readwrite", (_tx, stores) => {
    for (const task of tasks) stores.tasks.put(task);
  }),
  deleteMany: ids => transact("tasks", "readwrite", (_tx, stores) => {
    for (const id of ids) stores.tasks.delete(id);
  }),
  replaceAll: tasks => transact("tasks", "readwrite", (_tx, stores) => {
    stores.tasks.clear();
    for (const task of tasks) stores.tasks.put(task);
  })
};



const ENTITY_VERSION = 1;
function nowIso() { return new Date().toISOString(); }
function baseRecord(values = {}) {
  const now = nowIso();
  return { id: values.id || crypto.randomUUID(), entityVersion: values.entityVersion || ENTITY_VERSION, createdAt: values.createdAt || now, updatedAt: values.updatedAt || now, customFields: values.customFields || {} };
}
function createList(values = {}) {
  return { ...baseRecord(values), ...values, title: String(values.title || "").trim(), description: values.description || "", kind: values.kind || "regular", position: Number.isFinite(values.position) ? values.position : 0 };
}
function createSection(values = {}) {
  return { ...baseRecord(values), ...values, listId: values.listId, title: String(values.title || "").trim(), description: values.description || "", position: Number.isFinite(values.position) ? values.position : 0 };
}
function createProject(values = {}) {
  return { ...baseRecord(values), ...values, title: String(values.title || "").trim(), goal: values.goal || "", description: values.description || "", status: values.status || "active", dueDate: values.dueDate || null, dueTime: values.dueTime || null, completedAt: values.completedAt || null, position: Number.isFinite(values.position) ? values.position : 0 };
}
function createTask(values = {}) {
  return { ...baseRecord(values), ...values, listId: values.listId || INBOX_LIST_ID, sectionId: values.sectionId || null, projectId: values.projectId || null, title: String(values.title || "").trim(), description: values.description || "", status: values.status || "active", completedAt: values.completedAt || null, dueDate: values.dueDate || null, dueTime: values.dueTime || null, position: Number.isFinite(values.position) ? values.position : 0, projectPosition: Number.isFinite(values.projectPosition) ? values.projectPosition : null };
}
function isTaskCompleted(task) { return task.status === "completed" || task.done === true; }
function currentProjectTask(tasks, projectId) {
  return tasks.filter(task => task.projectId === projectId && !isTaskCompleted(task)).sort((a, b) => (a.projectPosition ?? Number.MAX_SAFE_INTEGER) - (b.projectPosition ?? Number.MAX_SAFE_INTEGER))[0] || null;
}



const BACKUP_FORMAT = "local-first-pwa-backup";
const APP_ID = "dims-tasks";
const BACKUP_FORMAT_VERSION = 2;

async function downloadBackup() {
  const payload = { format: BACKUP_FORMAT, appId: APP_ID, formatVersion: BACKUP_FORMAT_VERSION, databaseVersion: DB_VERSION, exportedAt: new Date().toISOString(), data: await appDb.exportAll() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `dims-tasks-${new Date().toISOString().slice(0, 10)}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
}

function isRecord(value) { return value && typeof value.id === "string" && typeof value.createdAt === "string"; }
async function parseBackup(file) {
  const value = JSON.parse(await file.text());
  if (value?.format !== BACKUP_FORMAT || value?.appId !== APP_ID) throw new Error("Це не резервна копія DimsTasks");
  if (value.formatVersion === 1 && Array.isArray(value?.data?.tasks)) {
    return { lists: [], sections: [], projects: [], tasks: value.data.tasks.map(task => createTask({ ...task, status: task.done ? "completed" : "active" })) };
  }
  if (value.formatVersion !== BACKUP_FORMAT_VERSION) throw new Error("Цю версію резервної копії ще не підтримано");
  if (!STORE_NAMES.every(name => Array.isArray(value?.data?.[name]))) throw new Error("Копія має неповну структуру даних");
  if (!STORE_NAMES.every(name => value.data[name].every(isRecord))) throw new Error("Копія містить пошкоджені записи");
  return value.data;
}
async function restoreBackup(file) { await appDb.replaceAll(await parseBackup(file)); }

  normalHeader: document.querySelector("#normal-header"),

  selectionClose: document.querySelector("#selection-close"),

  input: document.querySelector("#task-title"),
  description: document.querySelector("#task-description"),
  date: document.querySelector("#task-date"),
  dateLabel: document.querySelector("#date-label"),
  dialog: document.querySelector("#task-dialog"),
  detailHeader: document.querySelector(".detail-header"),
  detailFields: document.querySelector(".detail-fields"),
  attributePlaceholders: document.querySelector(".attribute-placeholders"),
  detailToggle: document.querySelector("#detail-toggle"),
  collapseTask: document.querySelector("#collapse-task"),

const dateFormatter = new Intl.DateTimeFormat("uk-UA", { day: "numeric", month: "short" });
let toastTimer;
let toastAction;

function localDateValue(date = new Date()) {
  const offset = date.getTimezoneOffset() * 60000;
  return new Date(date.getTime() - offset).toISOString().slice(0, 10);
}

function readableDate(value) {
  if (!value) return "Без дати";
  if (value === localDateValue()) return "Сьогодні";
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  if (value === localDateValue(tomorrow)) return "Завтра";
  return dateFormatter.format(new Date(`${value}T12:00:00`));
}

function hideToast() {
  clearTimeout(toastTimer);
  toastAction = null;
  els.toast.classList.remove("show", "undoable");
}

function toast(message, options = {}) {
  clearTimeout(toastTimer);
  toastAction = options.action || null;
  els.toastMessage.textContent = message;
  els.toast.classList.remove("show", "undoable");
  void els.toast.offsetWidth;
  if (toastAction) {
    els.toast.classList.add("undoable");
    els.toast.style.setProperty("--toast-duration", `${options.duration || 3000}ms`);
  }
  els.toast.classList.add("show");
  toastTimer = setTimeout(hideToast, options.duration || 1800);
}

els.toastAction.addEventListener("click", async () => {
  const action = toastAction;
  hideToast();
  if (action) await action();
});

function renderTasks(tasks, selectedIds = new Set()) {
  const active = tasks.filter(task => !isTaskCompleted(task));
  const selectionMode = selectedIds.size > 0;
  els.shell.classList.toggle("selection-active", selectionMode);
  els.normalHeader.hidden = selectionMode;
  els.selectionToolbar.hidden = !selectionMode;
  els.selectionCount.textContent = `Вибрано: ${selectedIds.size}`;
  els.list.classList.toggle("selection-mode", selectionMode);
  els.list.replaceChildren(...active.map(task => {
    const row = els.template.content.firstElementChild.cloneNode(true);
    row.dataset.id = task.id;
    const selected = selectedIds.has(task.id);
    row.classList.toggle("selected", selected);
    row.setAttribute("aria-selected", String(selected));
    row.querySelector(".task-text").textContent = task.title;
    row.querySelector(".task-date").textContent = readableDate(task.dueDate || task.createdAt?.slice(0, 10));
    row.querySelector(".task-open").setAttribute("aria-label", `Відкрити деталі: ${task.title}`);
    return row;
  }));
  els.list.hidden = active.length === 0;
  els.empty.hidden = active.length > 0;
  els.count.textContent = selectionMode
    ? `Вибрано: ${selectedIds.size}`
    : `${active.length} ${active.length === 1 ? "задача" : active.length > 1 && active.length < 5 ? "задачі" : "задач"}`;
}

function openComposer() {
  els.dialog.classList.remove("detail-mode");
  els.dialog.dataset.taskId = "";
  els.form.reset();
  els.detailHeader.hidden = true;
  els.detailFields.hidden = true;
  els.attributePlaceholders.hidden = true;
  els.detailToggle.hidden = true;
  els.formHint.hidden = false;
  els.date.value = localDateValue();
  els.dateLabel.textContent = "Сьогодні";
  els.dialog.showModal();
  requestAnimationFrame(() => els.input.focus());
}

function openTaskDetails(task) {
  els.dialog.classList.add("detail-mode");
  els.dialog.dataset.taskId = task.id;
  els.form.reset();
  els.detailHeader.hidden = false;
  els.detailFields.hidden = false;
  els.attributePlaceholders.hidden = false;
  els.detailToggle.hidden = false;
  els.formHint.hidden = true;
  els.input.value = task.title;
  els.description.value = task.description || "";
  els.date.value = task.dueDate || "";
  els.dateLabel.textContent = readableDate(task.dueDate);
  els.dialog.showModal();
  requestAnimationFrame(() => {
    els.input.style.height = "auto";
    els.input.style.height = `${Math.min(els.input.scrollHeight, 150)}px`;
  });
}

function enableTaskSwipe({ onDelete, isSelectionMode, onLongPress }) {
  let gesture = null;
  const maxReveal = 112;
  const deleteThreshold = 72;
  const settleDuration = 260;
  const deleteDuration = 300;

  els.list.addEventListener("pointerdown", event => {
    const card = event.target.closest(".task-card");
    if (!card || event.button > 0 || isSelectionMode()) return;
    const row = card.closest(".swipe-row");
    gesture = { row, card, pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, dx: 0, horizontal: false, longPress: false };
    row.classList.remove("settling");
    gesture.longPressTimer = setTimeout(() => {
      if (!gesture || gesture.pointerId !== event.pointerId || gesture.horizontal) return;
      gesture.longPress = true;
      row.dataset.longPressed = "true";
      onLongPress(row.dataset.id);
    }, 520);
  });

  els.list.addEventListener("pointermove", event => {
    if (!gesture || gesture.pointerId !== event.pointerId) return;
    const dx = event.clientX - gesture.startX;
    const dy = event.clientY - gesture.startY;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) clearTimeout(gesture.longPressTimer);
    if (!gesture.horizontal && Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) {
      gesture = null;
      return;
    }
    if (dx >= 0 && !gesture.horizontal) return;
    if (Math.abs(dx) > 8) {
      gesture.horizontal = true;
      if (!card.hasPointerCapture(event.pointerId)) card.setPointerCapture(event.pointerId);
    }
    if (!gesture.horizontal) return;
    gesture.dx = Math.max(-maxReveal, Math.min(0, dx));
    gesture.row.classList.add("swiping");
    gesture.card.style.transform = `translateX(${gesture.dx}px)`;
  });

  const finishGesture = event => {
    if (!gesture || gesture.pointerId !== event.pointerId) return;
    const { row, card, dx, horizontal, longPress, longPressTimer } = gesture;
    gesture = null;
    clearTimeout(longPressTimer);
    if (longPress) return;
    if (horizontal && Math.abs(dx) >= deleteThreshold) {
      row.classList.remove("swiping");
      row.classList.add("deleting");
      row.dataset.swiped = "true";
      setTimeout(() => onDelete(row.dataset.id), deleteDuration);
      return;
    }
    row.classList.remove("swiping");
    row.classList.add("settling");
    card.style.transform = "translateX(0)";
    setTimeout(() => row.classList.remove("settling"), settleDuration);
  };

  els.list.addEventListener("pointerup", finishGesture);
  els.list.addEventListener("pointercancel", finishGesture);
}


let tasks = [];
let selectedTaskIds = new Set();

async function refresh() {
  tasks = (await taskDb.all()).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  selectedTaskIds = new Set([...selectedTaskIds].filter(id => tasks.some(task => task.id === id)));
  renderTasks(tasks, selectedTaskIds);
}

function selectTask(id) {
  selectedTaskIds = new Set([id]);
  renderTasks(tasks, selectedTaskIds);
}

function toggleTaskSelection(id) {
  const next = new Set(selectedTaskIds);
  if (next.has(id)) next.delete(id); else next.add(id);
  selectedTaskIds = next;
  renderTasks(tasks, selectedTaskIds);
}

function clearTaskSelection() {
  selectedTaskIds = new Set();
  renderTasks(tasks, selectedTaskIds);
}

async function deleteSelectedTasks() {
  const deletedTasks = tasks.filter(task => selectedTaskIds.has(task.id));
  if (!deletedTasks.length) return;
  const deletedIds = deletedTasks.map(task => task.id);
  tasks = tasks.filter(task => !selectedTaskIds.has(task.id));
  selectedTaskIds = new Set();
  renderTasks(tasks, selectedTaskIds);
  try {
    await taskDb.deleteMany(deletedIds);
    const message = deletedTasks.length === 1 ? "Завдання видалено" : `Видалено завдань: ${deletedTasks.length}`;
    toast(message, {
      duration: 3000,
      action: async () => {
        await taskDb.putMany(deletedTasks);
        await refresh();
        toast("Завдання відновлено");
      }
    });
  } catch (_error) {
    tasks.push(...deletedTasks);
    await refresh();
    toast("Не вдалося видалити завдання");
  }
}

async function addTask() {
  const title = els.input.value.trim();
  if (!title) { els.input.focus(); return; }
  await taskDb.put(createTask({ title, dueDate: els.date.value || null }));
  els.dialog.close();
  await refresh();
  toast("Задачу додано");
}

async function saveOpenTask() {
  const id = els.dialog.dataset.taskId;
  if (!id) return;
  const task = tasks.find(item => item.id === id);
  const title = els.input.value.trim();
  if (!task || !title) return;
  await taskDb.put({ ...task, title, description: els.description.value.trim(), dueDate: els.date.value || null, updatedAt: new Date().toISOString() });
  await refresh();
}

async function closeTaskDetails() {
  await saveOpenTask();
  els.dialog.dataset.taskId = "";
  els.dialog.close();
}

async function deleteTask(id) {
  const task = tasks.find(item => item.id === id);
  if (!task) return;
  tasks = tasks.filter(item => item.id !== id);
  selectedTaskIds.delete(id);
  renderTasks(tasks, selectedTaskIds);
  try {
    await taskDb.delete(id);
    toast("Завдання видалено", {
      duration: 3000,
      action: async () => {
        await taskDb.put(task);
        await refresh();
        toast("Завдання відновлено");
      }
    });
  } catch (_error) {
    tasks.push(task);
    renderTasks(tasks, selectedTaskIds);
    toast("Не вдалося видалити завдання");
  }
}

els.add.addEventListener("click", openComposer);
els.collapseTask.addEventListener("click", closeTaskDetails);
els.selectionClose.addEventListener("click", clearTaskSelection);
els.deleteSelected.addEventListener("click", deleteSelectedTasks);
els.date.addEventListener("change", () => { els.dateLabel.textContent = readableDate(els.date.value); });
els.input.addEventListener("input", () => { els.input.style.height = "auto"; els.input.style.height = `${Math.min(els.input.scrollHeight, 150)}px`; });
els.input.addEventListener("keydown", event => { if (event.key === "Enter" && !event.shiftKey && !els.dialog.classList.contains("detail-mode")) { event.preventDefault(); addTask(); } if (event.key === "Escape") els.dialog.close(); });
els.form.addEventListener("submit", event => { event.preventDefault(); if (!els.dialog.classList.contains("detail-mode")) addTask(); });
els.dialog.addEventListener("close", () => { if (els.dialog.dataset.taskId) saveOpenTask().catch(() => toast("Не вдалося зберегти зміни")); });
els.dialog.addEventListener("pointerdown", event => {
  if (event.target !== els.dialog) return;
  const box = els.dialog.getBoundingClientRect();
  const outside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
  if (!outside) return;
  if (els.dialog.dataset.taskId) closeTaskDetails(); else els.dialog.close();
});
els.list.addEventListener("click", async event => {
  const row = event.target.closest(".swipe-row");
  if (row?.dataset.swiped) { delete row.dataset.swiped; return; }
  if (row?.dataset.longPressed) { delete row.dataset.longPressed; return; }
  if (selectedTaskIds.size && row) {
    toggleTaskSelection(row.dataset.id);
    return;
  }
  const toggle = event.target.closest(".toggle");
  const opener = event.target.closest(".task-open");
  if (opener && row) {
    const task = tasks.find(item => item.id === row.dataset.id);
    if (task) openTaskDetails(task);
    return;
  }
  if (!toggle) return;
  const task = tasks.find(item => item.id === row.dataset.id);
  const completedAt = new Date().toISOString();
  await taskDb.put({ ...task, status: "completed", completedAt, updatedAt: completedAt });
  await refresh();
  toast("Виконано");
});

els.detailToggle.addEventListener("click", async () => {
  const task = tasks.find(item => item.id === els.dialog.dataset.taskId);
  if (!task) return;
  const completedAt = new Date().toISOString();
  await taskDb.put({ ...task, title: els.input.value.trim() || task.title, description: els.description.value.trim(), dueDate: els.date.value || null, status: "completed", completedAt, updatedAt: completedAt });
  els.dialog.dataset.taskId = "";
  els.dialog.close();
  await refresh();
  toast("Виконано");
});

enableTaskSwipe({
  onDelete: deleteTask,
  isSelectionMode: () => selectedTaskIds.size > 0,
  onLongPress: selectTask
});
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
refresh().catch(() => toast("Не вдалося відкрити локальне сховище"));

</script>

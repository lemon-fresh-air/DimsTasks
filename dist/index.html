<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="description" content="Персональний local-first таск-менеджер">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <title>DimsTasks</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --text: #24231f;
  --muted: #777267;
  --line: #ded8cc;
  --accent: #ff5a36;
  --accent-dark: #d93c1d;
  --ink: #1e293b;
  --shadow: 0 20px 55px rgba(45, 38, 26, .09);
  --radius: 22px;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #181816;
  --surface: #24231f;
  --text: #f5f0e6;
  --muted: #aaa397;
  --line: #403e38;
  --accent: #ff7254;
  --accent-dark: #ff8b72;
  --ink: #e8e4da;
  --shadow: 0 20px 55px rgba(0, 0, 0, .24);
}



* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
body { margin: 0; min-width: 280px; min-height: 100vh; }
button, input { font: inherit; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }


.topbar, main { width: min(920px, calc(100% - 32px)); margin-inline: auto; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 34px 0 24px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(2rem, 8vw, 3.8rem); line-height: .9; letter-spacing: -.065em; }
h2 { font-size: clamp(1.35rem, 4vw, 2rem); letter-spacing: -.035em; }
.eyebrow { color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; font-weight: 750; margin-bottom: 8px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn, .secondary, .filter { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 10px 14px; }
.icon-btn { min-width: 44px; min-height: 44px; }
.composer, .workspace, .data-panel { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--radius); }
.composer { padding: clamp(20px, 5vw, 38px); background: var(--ink); color: var(--bg); }
.composer h2 { margin-bottom: 20px; }
#task-form { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
#task-title { width: 100%; min-height: 54px; border: 0; border-radius: 14px; padding: 0 17px; background: var(--surface); color: var(--text); }
#task-form button { border: 0; border-radius: 14px; padding: 0 22px; background: var(--accent); color: #fff; font-weight: 800; }
.workspace { margin-top: 18px; padding: clamp(20px, 5vw, 38px); }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
.filters { display: flex; gap: 5px; flex-wrap: wrap; }
.filter { padding: 8px 12px; font-size: .86rem; }
.filter.active { color: #fff; background: var(--text); border-color: var(--text); }
#task-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.task-card { display: grid; grid-template-columns: auto 1fr auto; gap: 13px; align-items: center; min-height: 58px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 15px; }
.toggle, .delete { width: 38px; height: 38px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); }
.toggle { border: 2px solid var(--line); }
.toggle span { opacity: 0; }
.task-card.done .toggle { background: var(--accent); border-color: var(--accent); color: #fff; }
.task-card.done .toggle span { opacity: 1; }
.task-card.done .task-text { text-decoration: line-through; color: var(--muted); }
.delete:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.empty { display: grid; place-items: center; gap: 8px; color: var(--muted); padding: 56px 12px 38px; text-align: center; }
.empty span { display: grid; place-items: center; width: 48px; height: 48px; border: 2px dashed var(--line); border-radius: 50%; }
.data-panel { margin: 18px 0 40px; padding: 18px 22px; box-shadow: none; }
summary { cursor: pointer; font-weight: 760; }
details p { color: var(--muted); margin: 14px 0; line-height: 1.55; }
.data-actions { display: flex; gap: 8px; }
.file-label { cursor: pointer; }
.file-label input { display: none; }
.toast { position: fixed; left: 50%; bottom: 24px; translate: -50% 20px; opacity: 0; pointer-events: none; padding: 11px 16px; border-radius: 999px; background: var(--text); color: var(--bg); transition: .2s; }
.toast.show { opacity: 1; translate: -50% 0; }
@media (max-width: 600px) {
  .topbar, main { width: min(100% - 20px, 920px); }
  .topbar { padding-top: 24px; }
  #task-form { grid-template-columns: 1fr; }
  #task-form button { min-height: 50px; }
  .section-head { align-items: start; flex-direction: column; }
}


  </style>
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">Персональний фокус</p>
    <h1>DimsTasks</h1>
  </div>
  <div class="header-actions">
    <button id="install-btn" class="icon-btn" hidden>Встановити</button>
    <button id="theme-btn" class="icon-btn" aria-label="Змінити тему">◐</button>
  </div>
</header>

<main>
  <section class="composer" aria-labelledby="new-task-title">
    <h2 id="new-task-title">Що треба зробити?</h2>
    <form id="task-form">
      <label class="sr-only" for="task-title">Нова задача</label>
      <input id="task-title" name="title" maxlength="160" autocomplete="off" placeholder="Наприклад: спланувати тиждень" required>
      <button type="submit">Додати</button>
    </form>
  </section>

  <section class="workspace" aria-labelledby="tasks-title">
    <div class="section-head">
      <div>
        <p class="eyebrow" id="task-count">0 активних</p>
        <h2 id="tasks-title">Мої задачі</h2>
      </div>
      <div class="filters" role="group" aria-label="Фільтр задач">
        <button class="filter active" data-filter="all">Усі</button>
        <button class="filter" data-filter="active">Активні</button>
        <button class="filter" data-filter="done">Готові</button>
      </div>
    </div>
    <ul id="task-list" aria-live="polite"></ul>
    <div id="empty-state" class="empty">
      <span>✓</span>
      <p>Тут поки тихо. Додайте першу задачу.</p>
    </div>
  </section>

  <section class="data-panel">
    <details>
      <summary>Дані та резервна копія</summary>
      <p>Задачі зберігаються тільки в цьому браузері. Експорт створює повну JSON-копію.</p>
      <div class="data-actions">
        <button id="export-btn" class="secondary">Експорт</button>
        <label class="secondary file-label">Відновити<input id="import-input" type="file" accept="application/json,.json"></label>
      </div>
    </details>
  </section>
</main>

<template id="task-template">
  <li class="task-card">
    <button class="toggle" aria-label="Позначити виконаною"><span>✓</span></button>
    <p class="task-text"></p>
    <button class="delete" aria-label="Видалити задачу">×</button>
  </li>
</template>

<div id="toast" class="toast" role="status" aria-live="polite"></div>


<script>
const DB_NAME = "dims-tasks-db";
const DB_VERSION = 1;
const STORE = "tasks";

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function transact(mode, action) {
  const db = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const result = action(tx.objectStore(STORE));
    tx.oncomplete = () => { db.close(); resolve(result?.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

const taskDb = {
  all: () => transact("readonly", store => store.getAll()),
  put: task => transact("readwrite", store => store.put(task)),
  delete: id => transact("readwrite", store => store.delete(id)),
  replaceAll: async tasks => {
    const db = await openDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      const store = tx.objectStore(STORE);
      store.clear();
      tasks.forEach(task => store.put(task));
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  }
};



const BACKUP_FORMAT = "local-first-pwa-backup";
const APP_ID = "dims-tasks";

function downloadBackup(tasks) {
  const payload = { format: BACKUP_FORMAT, appId: APP_ID, formatVersion: 1, databaseVersion: DB_VERSION, exportedAt: new Date().toISOString(), data: { tasks } };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `dims-tasks-${new Date().toISOString().slice(0, 10)}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
}

async function parseBackup(file) {
  const value = JSON.parse(await file.text());
  if (value?.format !== BACKUP_FORMAT || value?.appId !== APP_ID || value?.formatVersion !== 1 || !Array.isArray(value?.data?.tasks)) throw new Error("Це не резервна копія DimsTasks");
  const valid = value.data.tasks.every(task => typeof task.id === "string" && typeof task.title === "string" && typeof task.done === "boolean");
  if (!valid) throw new Error("Копія містить пошкоджені задачі");
  return value.data.tasks;
}



const els = {
  form: document.querySelector("#task-form"), input: document.querySelector("#task-title"), list: document.querySelector("#task-list"),
  empty: document.querySelector("#empty-state"), count: document.querySelector("#task-count"), template: document.querySelector("#task-template"), toast: document.querySelector("#toast")
};

function toast(message) {
  els.toast.textContent = message;
  els.toast.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => els.toast.classList.remove("show"), 2200);
}

function renderTasks(tasks, filter) {
  const visible = tasks.filter(task => filter === "all" || (filter === "done" ? task.done : !task.done));
  els.list.replaceChildren(...visible.map(task => {
    const row = els.template.content.firstElementChild.cloneNode(true);
    row.dataset.id = task.id;
    row.classList.toggle("done", task.done);
    row.querySelector(".task-text").textContent = task.title;
    row.querySelector(".toggle").setAttribute("aria-label", task.done ? "Позначити активною" : "Позначити виконаною");
    return row;
  }));
  els.empty.hidden = visible.length > 0;
  const active = tasks.filter(task => !task.done).length;
  els.count.textContent = `${active} ${active === 1 ? "активна" : "активних"}`;
}



let tasks = [];
let currentFilter = "all";
let installPrompt;

async function refresh() {
  tasks = (await taskDb.all()).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  renderTasks(tasks, currentFilter);
}

els.form.addEventListener("submit", async event => {
  event.preventDefault();
  const title = els.input.value.trim();
  if (!title) return;
  await taskDb.put({ id: crypto.randomUUID(), title, done: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
  els.form.reset();
  await refresh();
  toast("Задачу додано");
});

els.list.addEventListener("click", async event => {
  const row = event.target.closest(".task-card");
  if (!row) return;
  const task = tasks.find(item => item.id === row.dataset.id);
  if (event.target.closest(".toggle")) await taskDb.put({ ...task, done: !task.done, updatedAt: new Date().toISOString() });
  if (event.target.closest(".delete") && confirm(`Видалити «${task.title}»?`)) await taskDb.delete(task.id);
  await refresh();
});

document.querySelector(".filters").addEventListener("click", event => {
  const button = event.target.closest("[data-filter]");
  if (!button) return;
  currentFilter = button.dataset.filter;
  document.querySelectorAll(".filter").forEach(item => item.classList.toggle("active", item === button));
  renderTasks(tasks, currentFilter);
});

document.querySelector("#theme-btn").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("dims-theme", next);
});

document.querySelector("#export-btn").addEventListener("click", () => downloadBackup(tasks));
document.querySelector("#import-input").addEventListener("change", async event => {
  try {
    const restored = await parseBackup(event.target.files[0]);
    if (!confirm(`Замінити поточні дані та відновити ${restored.length} задач? Спершу за потреби зробіть експорт.`)) return;
    await taskDb.replaceAll(restored);
    await refresh();
    toast("Дані відновлено");
  } catch (error) { alert(error.message); }
  finally { event.target.value = ""; }
});

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault(); installPrompt = event; document.querySelector("#install-btn").hidden = false;
});
document.querySelector("#install-btn").addEventListener("click", async () => { await installPrompt?.prompt(); });

document.documentElement.dataset.theme = localStorage.getItem("dims-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
refresh().catch(() => toast("Не вдалося відкрити локальне сховище"));


</script>
</body>
</html>

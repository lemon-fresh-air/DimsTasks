<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="description" content="Персональний local-first таск-менеджер">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <title>DimsTasks</title>
  <style>
:root { color-scheme: light; --bg:#f5f5f5; --surface:#fff; --text:#171717; --muted:#6f6f72; --line:#e5e5e7; --accent:#3d5268; --date:#178b40; --overlay:rgba(20,20,20,.5); --shadow-fab:0 12px 26px rgba(32,46,60,.25); --shadow-sheet:0 -12px 40px rgba(0,0,0,.16); --radius:22px; }



* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
body { margin: 0; min-width: 280px; min-height: 100vh; }
button, input { font: inherit; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }


body { background:var(--bg); }
.app-shell { width:min(100%,760px); min-height:100dvh; margin:0 auto; padding:max(28px,env(safe-area-inset-top)) 20px calc(124px + env(safe-area-inset-bottom)); position:relative; }
.page-header { padding:18px 4px 54px; }
h1,h2,p { margin:0; }
h1 { font-size:clamp(2.25rem,9vw,3.4rem); line-height:1; letter-spacing:-.05em; font-weight:760; }
.page-header p { margin-top:9px; color:var(--muted); font-size:1.08rem; }
.task-section h2 { margin:0 4px 20px; font-size:1.35rem; letter-spacing:-.025em; }
#task-list { list-style:none; margin:0; padding:0; overflow:hidden; border-radius:var(--radius); background:var(--surface); }
.task-card { min-height:82px; display:grid; grid-template-columns:48px minmax(0,1fr) auto; align-items:center; gap:10px; padding:14px 17px 14px 13px; border-bottom:1px solid var(--line); }
.task-card:last-child { border-bottom:0; }
.toggle { width:34px; height:34px; display:grid; place-items:center; border:2px solid #aaa; border-radius:50%; background:transparent; color:#fff; }
.toggle span { opacity:0; }
.task-copy { min-width:0; }
.task-text { font-size:1.08rem; line-height:1.35; overflow-wrap:anywhere; }
.task-date { margin-top:5px; color:var(--date); font-size:.88rem; font-weight:590; }
.task-project { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:.9rem; white-space:nowrap; align-self:end; padding-bottom:5px; }
.inbox-icon { width:17px; height:15px; display:inline-block; border:2px solid currentColor; border-radius:3px 3px 5px 5px; position:relative; }
.inbox-icon::after { content:""; position:absolute; width:6px; height:3px; left:50%; bottom:2px; translate:-50% 0; border-bottom:2px solid currentColor; border-radius:50%; }
.empty { display:grid; justify-items:center; gap:8px; padding:76px 20px; color:var(--muted); text-align:center; }
.empty-icon { width:48px; height:48px; display:grid; place-items:center; border:2px solid var(--line); border-radius:50%; font-size:1.3rem; }
.empty p { color:var(--text); font-weight:680; }
.empty small { max-width:260px; line-height:1.45; }
.fab { position:fixed; z-index:5; right:max(22px,calc((100vw - 720px)/2)); bottom:calc(91px + env(safe-area-inset-bottom)); width:68px; height:68px; border:0; border-radius:22px; background:var(--accent); color:#fff; box-shadow:var(--shadow-fab); font-size:2.35rem; font-weight:300; display:grid; place-items:center; }
.fab:active { transform:translateY(2px); }
.bottom-nav { position:fixed; z-index:4; inset:auto 0 0; min-height:calc(72px + env(safe-area-inset-bottom)); padding:8px 20px env(safe-area-inset-bottom); display:flex; justify-content:center; background:color-mix(in srgb,var(--surface) 94%,transparent); border-top:1px solid var(--line); backdrop-filter:blur(16px); }
.nav-item { min-width:112px; min-height:56px; border:0; border-radius:18px; background:transparent; color:var(--accent); display:grid; place-items:center; align-content:center; gap:5px; font-size:.78rem; font-weight:700; }
.nav-item .inbox-icon { width:21px; height:18px; }
.nav-item.active { background:#e7eaf0; }
.task-dialog { width:min(100% - 20px,720px); max-width:none; margin:auto auto 10px; padding:0; border:0; border-radius:34px; background:var(--surface); color:var(--text); box-shadow:var(--shadow-sheet); overflow:visible; }
.task-dialog::backdrop { background:var(--overlay); backdrop-filter:blur(1px); }
#task-form { padding:26px 24px 18px; }
#task-title { display:block; width:100%; min-height:58px; max-height:150px; resize:none; overflow-y:auto; border:0; outline:0; padding:0; background:transparent; color:var(--text); font:650 clamp(1.45rem,6vw,2rem)/1.25 system-ui,sans-serif; }
#task-title::placeholder { color:#aaa; opacity:1; }
.composer-actions { display:flex; align-items:center; gap:10px; margin-top:18px; overflow-x:auto; scrollbar-width:none; }
.composer-actions::-webkit-scrollbar { display:none; }
.meta-chip { min-height:48px; display:inline-flex; align-items:center; gap:9px; flex:0 0 auto; padding:0 15px; border:0; border-radius:14px; background:#f3f3f5; color:var(--text); font-weight:700; }
.date-chip { color:var(--date); position:relative; cursor:pointer; }
.date-chip input { position:absolute; inset:0; opacity:0; width:100%; cursor:pointer; }
.calendar-icon { width:20px; height:20px; border:2px solid currentColor; border-radius:3px; position:relative; }
.calendar-icon::before { content:""; position:absolute; left:2px; right:2px; top:5px; border-top:2px solid currentColor; }
.form-hint { margin:13px 2px 0; color:var(--muted); font-size:.75rem; }
.toast { position:fixed; z-index:20; left:50%; bottom:calc(88px + env(safe-area-inset-bottom)); translate:-50% 16px; opacity:0; pointer-events:none; padding:11px 16px; border-radius:999px; background:var(--text); color:var(--surface); transition:opacity .18s,transform .18s; white-space:nowrap; }
.toast.show { opacity:1; translate:-50% 0; }
@media (min-width:760px) { .app-shell { padding-inline:28px; } .fab { right:max(32px,calc((100vw - 700px)/2)); } .task-dialog { margin-bottom:28px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; } }


  </style>
</head>
<body>
<div class="app-shell">
  <header class="page-header"><h1>Нові</h1><p id="task-count">0 задач</p></header>
  <main><section class="task-section" aria-labelledby="inbox-title">
    <h2 id="inbox-title">Нові</h2><ul id="task-list" aria-live="polite"></ul>
    <div id="empty-state" class="empty"><span class="empty-icon" aria-hidden="true">✓</span><p>Нових задач поки немає</p><small>Натисніть кнопку внизу, щоб додати першу.</small></div>
  </section></main>
  <button id="add-task-btn" class="fab" aria-label="Додати задачу"><span aria-hidden="true">＋</span></button>
  <nav class="bottom-nav" aria-label="Основна навігація"><button class="nav-item active" aria-current="page"><span class="inbox-icon" aria-hidden="true"></span><span>Нові</span></button></nav>
</div>
<dialog id="task-dialog" class="task-dialog">
  <form id="task-form" method="dialog">
    <label class="sr-only" for="task-title">Назва задачі</label>
    <textarea id="task-title" name="title" rows="1" maxlength="160" placeholder="Назва задачі" required></textarea>
    <div class="composer-actions">
      <span class="meta-chip inbox-chip"><span class="inbox-icon" aria-hidden="true"></span>Нові</span>
      <label class="meta-chip date-chip" for="task-date"><span class="calendar-icon" aria-hidden="true"></span><span id="date-label">Сьогодні</span><input id="task-date" name="date" type="date"></label>
    </div>
    <p class="form-hint">Enter — додати · Shift+Enter — новий рядок</p>
  </form>
</dialog>
<template id="task-template"><li class="task-card"><button class="toggle" aria-label="Позначити виконаною"><span>✓</span></button><div class="task-copy"><p class="task-text"></p><p class="task-date"></p></div><span class="task-project">Нові <span class="inbox-icon" aria-hidden="true"></span></span></li></template>
<div id="toast" class="toast" role="status" aria-live="polite"></div>


<script>
const DB_NAME = "dims-tasks-db";
const DB_VERSION = 1;
const STORE = "tasks";

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function transact(mode, action) {
  const db = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const result = action(tx.objectStore(STORE));
    tx.oncomplete = () => { db.close(); resolve(result?.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

const taskDb = {
  all: () => transact("readonly", store => store.getAll()),
  put: task => transact("readwrite", store => store.put(task)),
  delete: id => transact("readwrite", store => store.delete(id)),
  replaceAll: async tasks => {
    const db = await openDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      const store = tx.objectStore(STORE);
      store.clear();
      tasks.forEach(task => store.put(task));
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  }
};



const BACKUP_FORMAT = "local-first-pwa-backup";
const APP_ID = "dims-tasks";

function downloadBackup(tasks) {
  const payload = { format: BACKUP_FORMAT, appId: APP_ID, formatVersion: 1, databaseVersion: DB_VERSION, exportedAt: new Date().toISOString(), data: { tasks } };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `dims-tasks-${new Date().toISOString().slice(0, 10)}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
}

async function parseBackup(file) {
  const value = JSON.parse(await file.text());
  if (value?.format !== BACKUP_FORMAT || value?.appId !== APP_ID || value?.formatVersion !== 1 || !Array.isArray(value?.data?.tasks)) throw new Error("Це не резервна копія DimsTasks");
  const valid = value.data.tasks.every(task => typeof task.id === "string" && typeof task.title === "string" && typeof task.done === "boolean");
  if (!valid) throw new Error("Копія містить пошкоджені задачі");
  return value.data.tasks;
}



const els = { form:document.querySelector("#task-form"), input:document.querySelector("#task-title"), date:document.querySelector("#task-date"), dateLabel:document.querySelector("#date-label"), dialog:document.querySelector("#task-dialog"), add:document.querySelector("#add-task-btn"), list:document.querySelector("#task-list"), empty:document.querySelector("#empty-state"), count:document.querySelector("#task-count"), template:document.querySelector("#task-template"), toast:document.querySelector("#toast") };
const dateFormatter = new Intl.DateTimeFormat("uk-UA",{day:"numeric",month:"short"});
function localDateValue(date=new Date()){const offset=date.getTimezoneOffset()*60000;return new Date(date.getTime()-offset).toISOString().slice(0,10)}
function readableDate(value){if(!value)return "Без дати";if(value===localDateValue())return "Сьогодні";const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);if(value===localDateValue(tomorrow))return "Завтра";return dateFormatter.format(new Date(`${value}T12:00:00`))}
function toast(message){els.toast.textContent=message;els.toast.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>els.toast.classList.remove("show"),1800)}
function renderTasks(tasks){const active=tasks.filter(task=>!task.done);els.list.replaceChildren(...active.map(task=>{const row=els.template.content.firstElementChild.cloneNode(true);row.dataset.id=task.id;row.querySelector(".task-text").textContent=task.title;row.querySelector(".task-date").textContent=readableDate(task.dueDate||task.createdAt?.slice(0,10));return row}));els.list.hidden=active.length===0;els.empty.hidden=active.length>0;els.count.textContent=`${active.length} ${active.length===1?"задача":active.length>1&&active.length<5?"задачі":"задач"}`}
function openComposer(){els.form.reset();els.date.value=localDateValue();els.dateLabel.textContent="Сьогодні";els.dialog.showModal();requestAnimationFrame(()=>els.input.focus())}



let tasks=[];
async function refresh(){tasks=(await taskDb.all()).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));renderTasks(tasks)}
async function addTask(){const title=els.input.value.trim();if(!title){els.input.focus();return}await taskDb.put({id:crypto.randomUUID(),title,dueDate:els.date.value||null,done:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});els.dialog.close();await refresh();toast("Задачу додано")}
els.add.addEventListener("click",openComposer);
els.date.addEventListener("change",()=>{els.dateLabel.textContent=readableDate(els.date.value)});
els.input.addEventListener("input",()=>{els.input.style.height="auto";els.input.style.height=`${Math.min(els.input.scrollHeight,150)}px`});
els.input.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();addTask()}if(event.key==="Escape")els.dialog.close()});
els.form.addEventListener("submit",event=>{event.preventDefault();addTask()});
els.dialog.addEventListener("click",event=>{const box=els.dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)els.dialog.close()});
els.list.addEventListener("click",async event=>{const toggle=event.target.closest(".toggle");if(!toggle)return;const row=toggle.closest(".task-card");const task=tasks.find(item=>item.id===row.dataset.id);await taskDb.put({...task,done:true,updatedAt:new Date().toISOString()});await refresh();toast("Виконано")});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
refresh().catch(()=>toast("Не вдалося відкрити локальне сховище"));


</script>
</body>
</html>

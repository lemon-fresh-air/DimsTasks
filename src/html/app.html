<div class="app-shell">
  <header class="page-header">
    <div id="normal-header"><h1>Нові</h1><p id="task-count">0 задач</p></div>
    <div id="selection-toolbar" class="selection-toolbar" hidden>
      <button id="selection-close" class="toolbar-action" type="button" aria-label="Завершити виділення"><span class="back-icon" aria-hidden="true"></span></button>
      <p id="selection-count">Вибрано: 0</p>
      <div class="selection-actions" aria-label="Дії з вибраними завданнями">
        <button id="delete-selected" class="toolbar-action destructive" type="button" aria-label="Видалити вибрані завдання"><span class="trash-icon" aria-hidden="true"></span></button>
      </div>
    </div>
  </header>
  <main><section class="task-section" aria-labelledby="inbox-title">
    <h2 id="inbox-title">Нові</h2><ul id="task-list" aria-live="polite"></ul>
    <div id="empty-state" class="empty"><span class="empty-icon" aria-hidden="true">✓</span><p>Нових задач поки немає</p><small>Натисніть кнопку внизу, щоб додати першу.</small></div>
  </section></main>
  <button id="add-task-btn" class="fab" aria-label="Додати задачу"><span aria-hidden="true">＋</span></button>
  <nav class="bottom-nav" aria-label="Основна навігація"><button class="nav-item active" aria-current="page"><span class="inbox-icon" aria-hidden="true"></span><span>Нові</span></button></nav>
</div>
<div id="task-dialog" class="task-dialog" role="dialog" aria-modal="true" aria-label="Завдання" hidden>
  <form id="task-form">
    <span class="sheet-handle" aria-hidden="true"></span>
    <div class="detail-header" hidden>
      <span class="detail-list"><span class="inbox-icon" aria-hidden="true"></span>Нові</span>
      <button id="collapse-task" class="sheet-icon-button" type="button" aria-label="Згорнути деталі завдання"><span aria-hidden="true"></span></button>
    </div>
    <div class="task-title-row">
      <button id="detail-toggle" class="toggle detail-toggle" type="button" aria-label="Позначити виконаною" hidden><span>✓</span></button>
      <label class="sr-only" for="task-title">Назва задачі</label>
      <textarea id="task-title" name="title" rows="1" maxlength="160" placeholder="Назва задачі" required></textarea>
    </div>
    <div class="detail-fields" hidden>
      <span class="modal-field-icon description-icon" aria-hidden="true"></span>
      <label class="sr-only" for="task-description">Опис завдання</label>
      <textarea id="task-description" name="description" rows="2" maxlength="1000" placeholder="Додати опис…"></textarea>
    </div>
    <div class="composer-actions">
      <span class="meta-chip inbox-chip"><span class="inbox-icon" aria-hidden="true"></span>Нові</span>
      <label class="meta-chip date-chip" for="task-date"><span class="calendar-icon" aria-hidden="true"></span><span id="date-label">Сьогодні</span><input id="task-date" name="date" type="date"></label>
    </div>
    <div class="attribute-placeholders" hidden aria-label="Атрибути завдання">
      <button class="attribute-chip" type="button" disabled><span aria-hidden="true">⚑</span>Пріоритет</button>
      <button class="attribute-chip" type="button" disabled><span aria-hidden="true">◷</span>Нагадування</button>
      <button class="attribute-chip" type="button" disabled><span aria-hidden="true">◇</span>Мітки</button>
      <button class="attribute-chip" type="button" disabled><span aria-hidden="true">◎</span>Повтор</button>
    </div>
    <p class="form-hint">Enter — додати · Shift+Enter — новий рядок</p>
    <button id="save-task-button" class="save-task-button" type="submit">Створити задачу</button>
  </form>
</div>
<template id="task-template"><li class="swipe-row"><div class="delete-reveal" aria-hidden="true"><span class="delete-icon"></span><span>Видалити</span></div><article class="task-card"><button class="toggle" aria-label="Позначити виконаною"><span>✓</span></button><button class="task-open" type="button" aria-label="Відкрити деталі завдання"><span class="task-copy"><span class="task-text"></span><span class="task-description-preview" hidden></span><span class="task-date"></span></span><span class="task-project">Нові <span class="inbox-icon" aria-hidden="true"></span></span></button></article></li></template>
<div id="toast" class="toast" role="status" aria-live="polite"><span class="toast-message"></span><button id="toast-action" class="toast-action" type="button">Відмінити</button><svg class="toast-timer" viewBox="0 0 28 28" aria-hidden="true"><circle class="toast-timer-track" cx="14" cy="14" r="11"></circle><circle class="toast-timer-progress" cx="14" cy="14" r="11"></circle></svg></div>
